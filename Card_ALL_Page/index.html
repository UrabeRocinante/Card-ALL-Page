<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="カードイラストを一覧表示・並び替え・エクスポートするツール">
  <title>Card ALL Page — カードイラスト一覧</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <h1 class="app-title">Card ALL Page</h1>
    <button class="theme-toggle" id="theme-toggle" aria-label="テーマ切り替え">
      <span class="icon-moon">🌙</span>
      <span class="icon-sun">☀️</span>
    </button>
  </header>

  <!-- Upload Section -->
  <section class="upload-section" id="upload-section">
    <div class="upload-area" id="upload-front">
      <input type="file" id="front-file-input" multiple accept="image/*">
      <div class="upload-icon">🎴</div>
      <div class="upload-label">表面画像</div>
      <div class="upload-hint">クリックまたはドラッグ＆ドロップ</div>
      <div class="upload-counter" id="front-counter">0 / 16 枚</div>
    </div>
    <div class="upload-area" id="upload-back">
      <input type="file" id="back-file-input" multiple accept="image/*">
      <div class="upload-icon">🃏</div>
      <div class="upload-label">裏面画像</div>
      <div class="upload-hint">クリックまたはドラッグ＆ドロップ</div>
      <div class="upload-counter" id="back-counter">0 / 16 枚</div>
    </div>
  </section>

  <!-- Toolbar -->
  <div class="toolbar" id="toolbar">
    <div class="toggle-group" id="orientation-toggle">
      <button class="btn toggle-btn active" id="btn-portrait" title="縦向き (56.5 x 86.5 mm)">
        <span>📱</span>
        <span class="btn-label">縦向き</span>
      </button>
      <button class="btn toggle-btn" id="btn-landscape" title="横向き (86.5 x 56.5 mm)">
        <span>🖥️</span>
        <span class="btn-label">横向き</span>
      </button>
    </div>
    <div class="divider"></div>
    <div class="grid-dim-group">
      <label class="control-label" for="select-cols">列</label>
      <select class="select-control" id="select-cols">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4" selected>4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select>
      <span class="dim-separator">×</span>
      <label class="control-label" for="select-rows">行</label>
      <select class="select-control" id="select-rows">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4" selected>4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
      </select>
    </div>
    <div class="divider"></div>
    <button class="btn" id="btn-add-card" title="新しいカードスロットを末尾に追加">
      <span>➕</span>
      <span class="btn-label">カード追加</span>
    </button>
    <button class="btn" id="btn-all-front">
      <span>↩️</span>
      <span class="btn-label">全て表にする</span>
    </button>
    <button class="btn" id="btn-all-back">
      <span>🔄</span>
      <span class="btn-label">全て裏にする</span>
    </button>
    <button class="btn danger" id="btn-clear-all" title="全カード画像と設定をリセット">
      <span>🧹</span>
      <span class="btn-label">すべてクリア</span>
    </button>
    <div class="divider"></div>
    <button class="btn primary" id="btn-export-png">
      <span>📷</span>
      <span class="btn-label">PNGで保存</span>
    </button>
    <button class="btn primary" id="btn-export-pdf">
      <span>📄</span>
      <span class="btn-label">PDFで保存</span>
    </button>
  </div>

  <!-- Card Grid -->
  <div class="card-grid" id="card-grid">
    <div class="empty-state" id="empty-state">
      <div class="empty-icon">📁</div>
      <div class="empty-text">表面画像をアップロードしてください</div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast"></div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loading-overlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">エクスポート中...</div>
  </div>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
